name: Feature request
description: Propose a focused improvement to one Negroni phase.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - Research
        - Creative
        - Launch
        - Iteration
        - Loop
        - Cross-phase
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What practitioner problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, and the intended workflow.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and approval boundary
      description: Explain any data, spend, publishing, or account-mutation implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
