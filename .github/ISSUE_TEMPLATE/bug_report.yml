name: Bug report
description: Report reproducible incorrect behavior in Negroni.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer PII, private campaign data, signed URLs, or live account identifiers.
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - Research
        - Creative
        - Launch
        - Iteration
        - Loop
        - Cross-phase
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal, sanitized sequence that reproduces the bug.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Include sanitized logs, screenshots, or test output.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private data, and live account identifiers.
          required: true
